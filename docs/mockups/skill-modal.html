<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habitica Streak — skill popup (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* Six takes on the skill popup, each at phone width over a dimmed page.
   The switch at the top swaps the sample skill in all six. */
:root {
  --bg: #0b0a09;
  --text: #a1988a;
  --text-h: #ece3cd;
  --bone: #d8cdb5;
  --gold: #c8a96e;
  --gold-hi: #e6cf9a;
  --ember: #e0783a;
  --blood: #c8402f;
  --ash: #5c554a;
  --dmg-physical: #d0604f;
  --dmg-magic: #ab8dd8;
  --dmg-healing: #92bf88;
  --dmg-true: #f1e9d6;
  --line: rgba(200, 169, 110, 0.2);
  --line-mid: rgba(200, 169, 110, 0.4);
  --line-faint: rgba(200, 169, 110, 0.08);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; color: var(--bone); background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200, 169, 110, 0.1), transparent 70%), #070606;
  font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; font-weight: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }
.caps { font: 600 11px/1 'Cinzel', serif; letter-spacing: 0.2em; text-transform: uppercase; }

.page { max-width: 1260px; margin: 0 auto; padding: 30px 16px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: 0.32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin-bottom: 18px; }
.switch { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
.switch button { padding: 8px 12px; background: transparent; border: 1px solid var(--line); color: var(--text); font: 600 10.5px/1 'Cinzel', serif; letter-spacing: 0.16em; text-transform: uppercase; }
.switch button.on { border-color: var(--gold); color: var(--gold-hi); background: rgba(200, 169, 110, 0.07); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 34px 26px; justify-items: center; }
.opt { display: flex; flex-direction: column; gap: 12px; width: 360px; max-width: 100%; }
.opt > h2 { display: flex; align-items: baseline; gap: 10px; font-size: 12px; letter-spacing: 0.2em; color: var(--text-h); }
.opt > h2 b { color: var(--gold); font-weight: 600; }
.opt > p { font-style: italic; color: var(--text); font-size: 16px; line-height: 1.3; }

/* The dimmed page behind each popup. */
.screen { position: relative; display: flex; align-items: center; min-height: 640px; padding: 20px 14px; border: 1px solid rgba(200, 169, 110, 0.18); border-radius: 22px; overflow: hidden;
  background: repeating-linear-gradient(180deg, transparent 0 44px, rgba(200, 169, 110, 0.05) 44px 45px), radial-gradient(ellipse 80% 40% at 50% -6%, rgba(200, 169, 110, 0.12), transparent 70%), var(--bg); }
.screen::before { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62); }

/* Ashen popup frame. */
.modal { position: relative; width: 100%; padding: 18px 18px 16px;
  background: linear-gradient(180deg, rgba(24, 21, 18, 0.985), rgba(10, 9, 8, 0.985)); border: 1px solid var(--line-mid);
  box-shadow: 0 40px 80px -30px #000, 0 0 0 4px rgba(0, 0, 0, 0.6), 0 0 0 5px rgba(200, 169, 110, 0.13); }
.modal::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.75;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 12px no-repeat;
}
.close { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; display: grid; place-items: center; color: var(--text); font-size: 18px; line-height: 1; }
.title { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 28px; margin-bottom: 14px; font: 600 13.5px/1.3 'Cinzel', serif; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-hi); text-align: center; }
.title::before, .title::after { content: ''; flex: 1; max-width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--line-mid)); }
.title::after { background: linear-gradient(270deg, transparent, var(--line-mid)); }
.ico { display: inline-grid; place-items: center; line-height: 0; color: var(--k, var(--gold)); vertical-align: -2px; }
.ico svg { display: block; }
.pips { display: inline-flex; gap: 4px; vertical-align: 1px; }
.pips i { width: 6px; height: 6px; transform: rotate(45deg); border: 1px solid var(--ash); }
.pips i.on { background: var(--gold); border-color: var(--gold); }
.rule { height: 1px; margin: 14px 0; background: linear-gradient(90deg, transparent, var(--line-mid), transparent); }
.big { font: 600 40px/1 'Cinzel', serif; letter-spacing: 0.02em; color: var(--c); text-shadow: 0 0 22px color-mix(in srgb, var(--c) 35%, transparent); }
.muted { color: var(--text); }
.italic { font-style: italic; }

/* Shared bottom of every popup: overdrive (when it has it), then a quiet remove. */
.actions { margin-top: 16px; display: grid; gap: 10px; }
.overdrive { width: 100%; padding: 11px; border: 1px solid rgba(224, 120, 58, 0.7); color: var(--text-h); background: linear-gradient(180deg, rgba(160, 60, 20, 0.35), rgba(90, 30, 10, 0.35)); font: 600 11.5px/1 'Cinzel', serif; letter-spacing: 0.18em; text-transform: uppercase; }
.overdrive small { color: var(--gold-hi); letter-spacing: 0.1em; margin-left: 6px; }
.remove { justify-self: center; padding: 6px 10px; background: none; border: 0; color: rgba(200, 64, 47, 0.75); font: 600 10px/1 'Cinzel', serif; letter-spacing: 0.2em; text-transform: uppercase; }

/* A · today. */
.list { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; }
.list dt { align-self: center; font: 600 10.5px/1.2 'Cinzel', serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); }
.list dd { margin: 0; text-align: right; color: var(--text-h); }
.list .tag { font: 600 10px/1 'Cinzel', serif; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 5px 2px; border: 1px solid currentColor; color: var(--gold); margin-right: 4px; }
.btn-ghost { padding: 9px 12px; background: none; border: 1px solid rgba(200, 64, 47, 0.45); color: var(--dmg-physical); font: 600 11.5px/1 'Cinzel', serif; letter-spacing: 0.18em; text-transform: uppercase; }

/* B · the hit, front and centre. */
.hit { text-align: center; }
.hit .sub { margin-top: 6px; font: 600 10.5px/1 'Cinzel', serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text); }
.facts { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; color: var(--text-h); font-weight: 600; }
.facts span { display: inline-flex; align-items: center; gap: 5px; }
.facts .sep { width: 4px; height: 4px; transform: rotate(45deg); background: var(--ash); }
.chips { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid var(--line); font: 600 11px/1 'Cinzel', serif; letter-spacing: 0.06em; color: var(--text-h); }
.chip b { color: var(--gold); font-weight: 600; }
.note { margin-top: 12px; text-align: center; font-style: italic; color: var(--text); font-size: 16px; }

/* C · the hit worked out like a sum. */
.sum { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: baseline; }
.sum .k { display: flex; align-items: center; gap: 7px; color: var(--text-h); font-weight: 600; }
.sum .k small { color: var(--text); font-weight: 500; font-style: italic; font-size: 15px; }
.sum .v { font: 600 14px/1 'Cinzel', serif; color: var(--gold-hi); text-align: right; }
.sum .v.base { color: var(--text-h); }
.sum .total { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; margin-top: 2px; border-top: 1px solid var(--line-mid); }
.sum .total .caps { color: var(--text); }
.sum .total .big { font-size: 30px; }
.meta-line { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 14px; color: var(--text); }
.meta-line .caps { font-size: 10px; letter-spacing: 0.2em; }

/* D · three tiles, details folded away. */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile { padding: 10px 6px 9px; text-align: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
.tile .caps { display: block; font-size: 9.5px; letter-spacing: 0.18em; color: var(--text); margin-bottom: 7px; }
.tile .val { font: 600 19px/1 'Cinzel', serif; color: var(--text-h); }
.tile .val.c { color: var(--c); }
.tile small { display: block; margin-top: 5px; font-style: italic; color: var(--text); font-size: 14px; }
details { margin-top: 12px; border-top: 1px solid var(--line-faint); }
details summary { list-style: none; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px 0 2px; cursor: pointer; font: 600 10px/1 'Cinzel', serif; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: ''; width: 5px; height: 5px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform 0.2s; }
details[open] summary::after { transform: rotate(-135deg) translate(-1px, -1px); }
details .sum { margin-top: 10px; }

/* E · a skill card: a line of verse, numbers held back. */
.card { text-align: center; }
.card .emblem { width: 58px; height: 58px; margin: 2px auto 12px; display: grid; place-items: center; transform: rotate(45deg); border: 1px solid var(--gold); background: radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); box-shadow: 0 0 18px -4px color-mix(in srgb, var(--c) 60%, transparent); }
.card .emblem > * { transform: rotate(-45deg); }
.card .verse { margin-top: 12px; font-style: italic; font-size: 18px; line-height: 1.4; color: var(--bone); }
.card .verse b { font-style: normal; font: 600 15px/1 'Cinzel', serif; color: var(--c); letter-spacing: 0.04em; }
.card .row { display: flex; justify-content: center; gap: 16px; margin-top: 14px; color: var(--text); }
.card .row span { display: inline-flex; align-items: center; gap: 6px; }

/* F · streak-first: the road to the next mark. */
.road { margin-top: 4px; }
.road .head { display: flex; justify-content: space-between; align-items: baseline; }
.road .head .caps { color: var(--text); font-size: 10px; }
.road .count { font: 600 26px/1 'Cinzel', serif; color: var(--text-h); display: inline-flex; align-items: center; gap: 6px; }
.road .marks { position: relative; display: flex; justify-content: space-between; margin: 14px 4px 6px; }
.road .marks::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.road .marks::after { content: ''; position: absolute; left: 0; width: var(--fill); top: 50%; height: 1px; background: linear-gradient(90deg, #8a6a2c, var(--gold-hi)); box-shadow: 0 0 6px rgba(230, 199, 127, 0.5); }
.road .marks i { position: relative; z-index: 1; width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--ash); background: var(--bg); }
.road .marks i.on { border-color: var(--gold); background: var(--gold); box-shadow: 0 0 8px rgba(230, 199, 127, 0.5); }
.road .labels { display: flex; justify-content: space-between; margin: 0 -2px; font: 600 9.5px/1 'Cinzel', serif; color: var(--text); letter-spacing: 0.06em; }
.road .next { margin-top: 10px; text-align: center; font-style: italic; color: var(--text); }
.road-hit { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
.road-hit .caps { color: var(--text); font-size: 10px; }
.road-hit .big { font-size: 28px; }
.road-hit small { display: block; margin-top: 4px; text-align: right; font-style: italic; color: var(--text); font-size: 14.5px; }
</style>
</head>
<body>
<div class="page">
  <h1 class="engraved">The skill popup</h1>
  <p>Six ways to say less. Switch the sample skill to see each one with a bad habit or an Ult.</p>
  <div class="switch" id="switch"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const LUCIDE = {
  sword: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  heart: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  sparkle: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
  crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',
  skull: '<path d="m12.5 17-.5-1-.5 1h1z"/><path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="12" r="1"/>',
  gear: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  week: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
};
const ico = (name, k, size = 14, fill = 'none') => `<i class="ico" style="--k:${k}"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[name]}</svg></i>`;
const pips = (n) => `<span class="pips">${[1, 2, 3].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;

const SAMPLES = {
  special: {
    label: 'Morning run · Special', name: 'Morning run', type: 'Physical', icon: 'sword', c: 'var(--dmg-physical)', period: 'Daily', pips: 2, difficulty: 'Medium',
    streak: 12, bad: false, base: 420, mult: [['Streak', 'flame', '#8d8475', 2.2], ['Gear', 'gear', '#a8a092', 1.15]],
    bonus: { kind: 'Special', icon: 'sparkle', k: 'var(--gold-hi)', x: 1.5 }, hit: 1594, plain: 1063, overdrive: null,
  },
  bad: {
    label: 'Doomscrolling · bad', name: 'Doomscrolling', type: 'Physical', icon: 'sword', c: 'var(--dmg-physical)', period: 'Daily', pips: 2, difficulty: 'Medium',
    streak: 4, bad: true, base: 380, mult: [['Streak', 'flame', '#8d8475', 1.4], ['Gear', 'gear', '#a8a092', 1.15]],
    bonus: null, hit: 612, plain: 612, overdrive: null,
  },
  ult: {
    label: 'Long hike · Ult + Overdrive', name: 'Long hike', type: 'Physical', icon: 'sword', c: 'var(--dmg-physical)', period: 'Weekly', pips: 3, difficulty: 'Hard',
    streak: 4, bad: false, base: 500, mult: [['Streak', 'flame', '#8d8475', 2.2], ['Gear', 'gear', '#a8a092', 1.15], ['Weekly', 'week', 'var(--gold)', 2]],
    bonus: { kind: 'Ult', icon: 'crown', k: 'var(--ember)', x: 2.5 }, hit: 6325, plain: 2530, overdrive: { left: 2, hit: 1265 },
  },
};
const MILESTONES = [5, 10, 20, 30, 50, 100];
const nextMark = (n) => MILESTONES.find((m) => m > n);
const fmt = (n) => n.toLocaleString('en-US');
const x = (v) => `×${v.toFixed(2).replace(/0$/, '')}`;

const close = '<span class="close" aria-hidden="true">×</span>';
const title = (s) => `${close}<h3 class="title">${s.name}</h3>`;
const actions = (s, overdriveLabel = (o) => `Overdrive<small>${o.left} left · ${fmt(o.hit)}</small>`) =>
  `<div class="actions">${s.overdrive ? `<button class="overdrive">${overdriveLabel(s.overdrive)}</button>` : ''}<button class="remove">Remove skill</button></div>`;
const sigil = (s, size = 13) => (s.bonus ? ico(s.bonus.icon, s.bonus.k, size, 'currentColor') : '');
const hitWord = (s) => (s.bad ? 'Resisted' : s.type === 'Healing' ? 'Heals' : 'Hit');

// The sum shared by C and D.
const sum = (s) => `<div class="sum">
  <span class="k">Base</span><span class="v base">${fmt(s.base)}</span>
  ${s.mult.map(([k, icon, color, v]) => `<span class="k">${ico(icon, color)}${k}${k === 'Streak' ? ` <small>${s.streak}</small>` : ''}</span><span class="v">${x(v)}</span>`).join('')}
  ${s.bonus ? `<span class="k">${sigil(s)}${s.bonus.kind} <small>first hit</small></span><span class="v">${x(s.bonus.x)}</span>` : ''}
  <div class="total"><span class="caps">${s.bad ? 'If resisted' : 'Strikes for'}</span><span class="big" style="--c:${s.c}">${fmt(s.hit)}</span></div>
</div>`;

const OPTIONS = [
  {
    id: 'a', title: 'Today', note: 'Every number on its own line. Eleven rows before you reach the buttons.',
    body: (s) => `${title(s)}<dl class="list">
      <dt>Type</dt><dd>${s.bad ? 'Bad Habit' : 'Good Habit'}</dd>
      <dt>Period</dt><dd>${s.period.toLowerCase()}</dd>
      <dt>Difficulty</dt><dd>${s.difficulty.toLowerCase()}</dd>
      <dt>Damage type</dt><dd>${s.type.toLowerCase()}</dd>
      <dt>Streak</dt><dd>${s.streak}</dd>
      <dt>Streak multiplier</dt><dd>${x(s.mult[0][3])}</dd>
      <dt>Item multiplier</dt><dd>${x(s.mult[1][3])}</dd>
      ${s.period === 'Weekly' ? `<dt>Weekly bonus</dt><dd>${x(s.mult[2][3])}</dd>` : ''}
      ${s.bonus ? `<dt>Bonus</dt><dd><span class="tag">${s.bonus.kind}</span>${x(s.bonus.x)} (first use only)</dd>` : ''}
      <dt>${s.bad ? 'Base reward if avoided' : 'Base damage'}</dt><dd>${s.base}</dd>
      <dt>${s.bad ? 'Effective reward if avoided' : 'Effective damage'}</dt><dd>${s.hit}</dd>
    </dl><div class="rule"></div>
    ${s.overdrive ? `<button class="overdrive" style="margin-bottom:12px">Overdrive (${s.overdrive.left} left) — ${s.overdrive.hit} dmg</button>` : ''}
    <button class="btn-ghost">Remove habit</button>`,
  },
  {
    id: 'b', title: 'The hit', note: 'One big number. What it is in a line of icons, and the multipliers as small chips.',
    body: (s) => `${title(s)}<div class="hit">
      <div class="big" style="--c:${s.c}">${fmt(s.hit)}</div>
      <p class="sub">${s.bad ? 'Each day resisted' : s.bonus ? `First ${s.bonus.kind.toLowerCase()} strike` : 'Each strike'}</p>
      <div class="facts"><span>${ico(s.icon, s.c)}${s.type}</span><i class="sep"></i><span>${s.period}</span><i class="sep"></i>${pips(s.pips)}</div>
      <div class="chips">
        ${s.mult.map(([k, icon, color, v]) => `<span class="chip">${ico(icon, color, 12)}<b>${x(v)}</b>${k === 'Streak' ? s.streak : ''}</span>`).join('')}
        ${s.bonus ? `<span class="chip">${sigil(s, 12)}<b>${x(s.bonus.x)}</b></span>` : ''}
      </div>
      ${s.bonus ? `<p class="note">Then ${fmt(s.plain)}.</p>` : ''}
      ${s.bad ? '<p class="note">Give in, and it strikes you.</p>' : ''}
    </div>${actions(s)}`,
  },
  {
    id: 'c', title: 'The sum', note: 'The hit worked out top to bottom, like a receipt. Type and period sit in one line above it.',
    body: (s) => `${title(s)}
      <div class="meta-line">${ico(s.icon, s.c)}<span class="caps">${s.type}</span><span class="caps">·</span><span class="caps">${s.period}</span>${pips(s.pips)}</div>
      ${sum(s)}${actions(s)}`,
  },
  {
    id: 'd', title: 'Three tiles', note: 'Hit, streak and the bonus at a glance, like the hero popup. The working folds away.',
    body: (s) => `${title(s)}<div class="tiles">
      <div class="tile"><span class="caps">${hitWord(s)}</span><span class="val c" style="--c:${s.c}">${fmt(s.hit)}</span><small>${s.period.toLowerCase()}</small></div>
      <div class="tile"><span class="caps">Streak</span><span class="val">${ico('flame', '#8d8475', 15)} ${s.streak}</span><small>${x(s.mult[0][3])}</small></div>
      <div class="tile"><span class="caps">${s.bonus ? s.bonus.kind : 'Gear'}</span><span class="val">${s.bonus ? sigil(s, 15) + ' ' + x(s.bonus.x) : x(s.mult[1][3])}</span><small>${s.bonus ? 'first hit' : 'from items'}</small></div>
    </div>
    <details><summary>How it lands</summary>${sum(s)}</details>${actions(s)}`,
  },
  {
    id: 'e', title: 'Skill card', note: 'An emblem and a line of verse. The only numbers are the hit and the streak.',
    body: (s) => `${title(s)}<div class="card" style="--c:${s.c}">
      <div class="emblem">${s.bonus ? sigil(s, 24) : ico(s.bad ? 'skull' : s.icon, s.bad ? 'var(--blood)' : s.c, 24)}</div>
      ${pips(s.pips)}
      <p class="verse">${s.bad
        ? `Resist it, and the boss takes <b>${fmt(s.hit)}</b>.<br>Give in, and it strikes you.`
        : s.bonus
          ? `Strikes for <b>${fmt(s.hit)}</b>, then <b>${fmt(s.plain)}</b>.`
          : `Strikes for <b>${fmt(s.hit)}</b>.`}</p>
      <div class="row"><span>${ico('flame', '#8d8475')}${s.streak} unbroken</span><span>${s.period}</span></div>
    </div>${actions(s, (o) => `Overdrive<small>${o.left} left</small>`)}`,
  },
  {
    id: 'f', title: 'The road', note: 'The streak and the next milestone up top, the hit below. Makes the streak feel like the goal.',
    body: (s) => {
      const next = nextMark(s.streak);
      const shown = MILESTONES.slice(0, 5);
      // How far along the evenly spaced marks the streak sits.
      const i = shown.findLastIndex((m) => m <= s.streak);
      const fill = i < 0 ? 0 : i === shown.length - 1 ? 100 : ((i + (s.streak - shown[i]) / (shown[i + 1] - shown[i])) / (shown.length - 1)) * 100;
      return `${title(s)}<div class="road">
        <div class="head"><span class="caps">Streak</span><span class="count">${ico('flame', '#8d8475', 20)}${s.streak}</span></div>
        <div class="marks" style="--fill:${fill}%">${shown.map((m) => `<i class="${m <= s.streak ? 'on' : ''}"></i>`).join('')}</div>
        <div class="labels">${shown.map((m) => `<span>${m}</span>`).join('')}</div>
        <p class="next">${next - s.streak} more to the next mark.</p>
      </div>
      <div class="road-hit"><div><span class="caps">${s.bad ? 'If resisted' : 'Strikes for'}</span><br>${ico(s.icon, s.c)} <span class="muted">${s.period}</span> ${pips(s.pips)}</div>
        <div><span class="big" style="--c:${s.c}">${fmt(s.hit)}</span>${s.bonus ? `<small>${sigil(s, 11)} then ${fmt(s.plain)}</small>` : ''}</div></div>
      ${actions(s)}`;
    },
  },
];

let current = 'special';
function render() {
  document.getElementById('switch').innerHTML = Object.entries(SAMPLES).map(([k, s]) => `<button class="${k === current ? 'on' : ''}" data-k="${k}">${s.label}</button>`).join('');
  document.getElementById('grid').innerHTML = OPTIONS.map((o) => `
    <div class="opt">
      <h2 class="engraved"><b>${o.id.toUpperCase()}</b>${o.title}</h2>
      <p>${o.note}</p>
      <div class="screen"><div class="modal">${o.body(SAMPLES[current])}</div></div>
    </div>`).join('');
}
document.getElementById('switch').addEventListener('click', (e) => {
  const k = e.target.closest('button')?.dataset.k;
  if (k) { current = k; render(); }
});
render();
</script>
</body>
</html>
