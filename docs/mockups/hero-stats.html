<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habitica Streak — hero stats, with vs without (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* Option C (large boss, condensed hero) where the boss panel morphs into a
   compact pinned bar as you scroll, driven by the scroll position itself.
   The panel keeps a fixed height and is sticky with a negative top, so it
   scrolls up until only its last COMPACT px remain; JS only moves the
   pieces inside to match how far it has collapsed. */
:root {
  --bg: #0b0a09;
  --text: #a1988a;
  --text-h: #ece3cd;
  --bone: #d8cdb5;
  --gold: #c8a96e;
  --gold-hi: #e6cf9a;
  --blood: #c8402f;
  --dmg-physical: #d0604f;
  --dmg-magic: #ab8dd8;
  --dmg-healing: #92bf88;
  --dmg-true: #f1e9d6;
  --line: rgba(200, 169, 110, 0.2);
  --line-mid: rgba(200, 169, 110, 0.4);
  --line-faint: rgba(200, 169, 110, 0.07);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--bone); background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200, 169, 110, 0.1), transparent 70%), #070606; font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif; }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
img { display: block; image-rendering: pixelated; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }

.page { max-width: 1200px; margin: 0 auto; padding: 30px 20px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: 0.32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin-bottom: 28px; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.opt h2 { font-size: 11px; letter-spacing: 0.3em; color: var(--text); }

.phone {
  position: relative; width: 360px; max-width: 100%; height: 700px; overflow: hidden; border-radius: 30px;
  background: radial-gradient(ellipse 80% 40% at 50% -6%, rgba(200, 169, 110, 0.12), transparent 70%), var(--bg);
  border: 1px solid rgba(200, 169, 110, 0.3); box-shadow: 0 30px 60px -20px #000, 0 0 0 6px #141210, 0 0 0 7px rgba(200, 169, 110, 0.15);
}
.screen { position: absolute; inset: 0; overflow-y: auto; padding: 0 12px 40px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen > * + * { margin-top: 12px; }

/* ---------- The morphing boss ---------- */
.boss {
  position: sticky; z-index: 5; height: var(--full-h); margin-top: 12px;
  /* top is set from JS: -(full height - compact height). Nothing may spill
     past the bottom edge mid-collapse (the top/side slack keeps the frame's
     diamond and corner brackets). */
  clip-path: inset(-10px -10px 0 -10px);
}
/* The hero strip pins just under the compact boss bar (.panel would
   otherwise reset it to position: relative). */
.panel.hero-pin { position: sticky; z-index: 4; }
.boss-frame {
  position: absolute; left: 0; right: 0; bottom: 0; top: var(--frame-top, 0px);
  background: linear-gradient(180deg, rgba(27, 24, 21, 0.98), rgba(14, 13, 11, 0.99)); border: 1px solid var(--line);
  box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.95);
}
.boss-frame::before {
  content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: 0.75;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 10px no-repeat;
}
.boss-frame::after { content: ''; position: absolute; top: -4px; left: 50%; width: 7px; height: 7px; transform: translateX(-50%) rotate(45deg); background: var(--bg); border: 1px solid var(--gold); }
.boss .piece { position: absolute; will-change: transform; }
.stage {
  overflow: hidden; isolation: isolate; display: flex; align-items: flex-end; justify-content: center;
  background: radial-gradient(ellipse 55% 58% at 50% 60%, rgba(215, 205, 185, 0.16), transparent 72%), radial-gradient(ellipse 85% 32% at 50% 100%, rgba(224, 120, 58, 0.2), transparent 70%);
  border: 1px solid rgba(200, 169, 110, calc(var(--p, 0) * 0.22));
}
.stage::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 200%; z-index: -1;
  background-image: radial-gradient(1.5px 1.5px at 20% 30%, #ffb06a 50%, transparent 55%), radial-gradient(1.2px 1.2px at 40% 70%, #ffd08f 50%, transparent 55%), radial-gradient(1.6px 1.6px at 66% 40%, #ff9a52 50%, transparent 55%), radial-gradient(1.2px 1.2px at 84% 64%, #ffd59a 50%, transparent 55%);
  background-size: 100% 50%; animation: rise 13s linear infinite; }
.stage img { filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.9)); }
.boss-name { font-size: 13px; letter-spacing: 0.16em; color: var(--text-h); white-space: nowrap; transform-origin: left top; }
.bar { position: relative; height: 7px; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(200, 169, 110, 0.32); }
.bar > i { display: block; height: 100%; width: var(--pct, 100%); transition: width 0.45s cubic-bezier(0.2, 0.8, 0.3, 1); }
.bar.hp > i { background: linear-gradient(180deg, #cf4a32, #901d19 60%, #6c1411); box-shadow: 0 0 8px rgba(195, 58, 46, 0.35); }
.bar.exp { height: 4px; } .bar.exp > i { background: linear-gradient(90deg, #8a6a2c, #e6c77f); }
.num { font: 600 9.5px/1 'Cinzel', serif; letter-spacing: 0.1em; color: var(--text); text-align: right; white-space: nowrap; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 11px; font-weight: 700; font-size: 14.5px; color: var(--text-h); }
.stats span { display: inline-flex; align-items: center; gap: 3px; }
.ico { display: inline-grid; place-items: center; line-height: 0; color: var(--k, var(--gold)); }
.ico svg { display: block; }

/* ---------- Condensed hero + the rest ---------- */
.panel {
  position: relative; padding: 13px 14px; background: linear-gradient(180deg, rgba(27, 24, 21, 0.96), rgba(14, 13, 11, 0.98)); border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.95);
}
.panel::before {
  content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: 0.75;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 10px no-repeat;
}
.panel h3 { font-size: 11.5px; letter-spacing: 0.22em; color: var(--gold-hi); }
.hero-row { display: flex; align-items: center; gap: 11px; }
.hero-row .mini { flex-shrink: 0; width: 52px; height: 52px; display: grid; place-items: end center; background: radial-gradient(circle at 50% 55%, rgba(230, 199, 127, 0.1), transparent 70%); border: 1px solid var(--line); }
.player { position: relative; width: 50px; height: 50px; }
.player img { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-row .who { flex: 1; min-width: 0; }
.hero-row h3 { color: var(--text-h); font-size: 11px; letter-spacing: 0.16em; margin-bottom: 7px; }
.hero-row .num { margin-top: 4px; }
.hero-row .bar.exp { margin-top: 5px; }
/* The stats line, as it would sit in the condensed hero strip. */
.hero-stats, .cstats { justify-content: flex-start; flex-wrap: nowrap; gap: 0 8px; font-size: 13px; white-space: nowrap; }
.hero-stats { margin-top: 7px; }
.page > .pair-label { width: 100%; text-align: center; margin: 6px 0 14px; font: 600 10px/1 'Cinzel', serif; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); }
.page > .row + .pair-label { margin-top: 40px; }
.group { display: flex; align-items: center; gap: 10px; margin: 10px 0 2px; font: 600 9px/1 'Cinzel', serif; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); }
.group::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-mid), transparent); }
.skill { display: flex; align-items: center; gap: 11px; padding: 10px 6px 10px 8px; border-bottom: 1px solid var(--line-faint); }
.skill .dia { appearance: none; flex-shrink: 0; width: 13px; height: 13px; margin: 0 3px; transform: rotate(45deg); border: 1px solid var(--gold); background: rgba(0, 0, 0, 0.45); cursor: pointer; transition: background 0.3s, box-shadow 0.3s; }
.skill .dia:checked { background: radial-gradient(circle, #fff3d0 0, #e6c77f 38%, #a8832f 82%); border-color: #f3dda6; box-shadow: 0 0 12px 1px rgba(230, 180, 90, 0.55); cursor: default; }
.skill .name { flex: 1; font-weight: 600; color: var(--text-h); }
.skill:has(.dia:checked) .name { color: #5c554a; text-decoration: line-through 1px rgba(200, 169, 110, 0.45); }
.skill .pips { display: flex; gap: 4px; }
.skill .pips i { width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid #5c554a; }
.skill .pips i.on { background: var(--gold); border-color: var(--gold); }
.skill .dmg { width: 44px; text-align: right; font: 600 14.5px/1 'Cinzel', serif; color: var(--c); }
.quest { display: flex; align-items: center; gap: 11px; padding: 10px 12px; margin-top: 8px; background: linear-gradient(90deg, rgba(200, 64, 47, 0.12), rgba(0, 0, 0, 0.22) 55%); border: 1px solid rgba(200, 169, 110, 0.12); border-left: 2px solid var(--blood); }
.quest.soon { border-left-color: #d49a46; background: linear-gradient(90deg, rgba(212, 154, 70, 0.12), rgba(0, 0, 0, 0.22) 55%); }
.quest .dia { width: 13px; height: 13px; margin: 0 3px; transform: rotate(45deg); border: 1px solid var(--gold); }
.quest b { display: block; font-weight: 600; color: var(--text-h); }
.quest small { font: 600 8.5px/1 'Cinzel', serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--blood); }
.quest.soon small { color: #d49a46; }
.log li { padding: 5px 0; border-bottom: 1px solid var(--line-faint); font-style: italic; color: var(--text); font-size: 15px; }
.log li:first-child { color: var(--bone); }
.log li:last-child { border-bottom: 0; }

.float { position: absolute; z-index: 30; pointer-events: none; font: 600 17px/1 'Cinzel', serif; letter-spacing: 0.04em; text-shadow: 0 0 10px #000, 0 0 2px #000; animation: float 1s ease-out forwards; }
.shake { animation: shake 0.32s ease; }

@keyframes rise { to { transform: translateY(-50%); } }
@keyframes float { 0% { opacity: 0; transform: translate(-50%, 6px) scale(0.9); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -34px) scale(1); } }
@keyframes shake { 20% { translate: -3px 0; } 40% { translate: 4px 0; } 60% { translate: -4px 0; } 80% { translate: 2px 0; } }
@media (prefers-reduced-motion: reduce) { .stage::before, .float, .shake { animation: none; } }
</style>
</head>
<body>
<div class="page">
  <h1 class="engraved">Hero stats: now vs. with stats</h1>
  <p>Left is what we have now; right adds the stats line to the hero strip. Every phone scrolls, and ticking a skill lands a hit.</p>
  <p class="pair-label">At the top</p>
  <div class="row" id="row-top"></div>
  <p class="pair-label">Scrolled, both pinned</p>
  <div class="row" id="row-pinned"></div>
</div>

<script>
const S = '../../public/sprites/';
const BOSS = `${S}bosses/armored.png`;
const HERO_LAYERS = ['base-skin', 'base-shirt', 'armor-3', 'base-hair', 'shield-3', 'weapon-physical-3'];
const LUCIDE = {
  sword: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  wand: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  crosshair: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  heart: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
};
const ico = (name, k) => `<i class="ico" style="--k:${k}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[name]}</svg></i>`;

const SKILLS = [
  ['Meditate', 'healing', 1, 318], ['Morning run', 'physical', 2, 486], ['Doomscrolling', 'physical', 2, 412],
  ['Read 20 pages', 'magic', 1, 274], ['Deep work block', 'magic', 3, 548], ['Cold shower', 'true', 1, 201],
];
const WEEKLY = [['Call family', 'healing', 1, 640], ['Meal prep', 'physical', 3, 1380]];
const skillRow = ([name, type, pips, dmg]) => `<li class="skill"><input type="checkbox" class="dia" data-type="${type}" data-dmg="${dmg}" aria-label="Complete ${name}" /><span class="name">${name}</span><span class="pips">${[1, 2, 3].map((n) => `<i class="${n <= pips ? 'on' : ''}"></i>`).join('')}</span><span class="dmg" style="--c:var(--dmg-${type})">${dmg}</span></li>`;

const BOSS_STATS = `<span>${ico('sword', 'var(--dmg-physical)')}75</span><span>${ico('wand', 'var(--dmg-magic)')}72</span><span>${ico('shield', '#a8a092')}258</span><span>${ico('crosshair', '#d6a24f')}2%</span>`;
const HERO_STATS = `<span>${ico('sword', 'var(--dmg-physical)')}812</span><span>${ico('wand', 'var(--dmg-magic)')}511</span><span>${ico('heart', 'var(--dmg-healing)')}402</span><span>${ico('zap', 'var(--dmg-true)')}562</span><span>${ico('crosshair', '#d6a24f')}34%</span>`;

// withStats adds the hero's stats line, and — since the pinned boss box
// matches the hero box — the boss's own stats in its compact state.
const markup = (withStats) => `
  <section class="boss" data-boss>
    <div class="boss-frame"></div>
    <div class="piece stage" data-piece="stage"><img data-piece="sprite" src="${BOSS}" alt="" /></div>
    <h3 class="piece boss-name engraved" data-piece="name">Iron Guardian</h3>
    <div class="piece bar hp" data-piece="bar"><i></i></div>
    <p class="piece num" data-piece="num"></p>
    <p class="piece stats" data-piece="stats">${BOSS_STATS}</p>
    ${withStats ? `<p class="piece stats cstats" data-piece="cstats">${BOSS_STATS}</p>` : ''}
  </section>
  <section class="panel hero-pin" data-hero>
    <div class="hero-row"><div class="mini"><div class="player">${HERO_LAYERS.map((l) => `<img src="${S}player/${l}.png" alt="" />`).join('')}</div></div>
    <div class="who"><h3 class="engraved">Rjcca — Lv. 6</h3><div class="bar hp" data-hero-bar><i></i></div><p class="num" data-hero-num></p><div class="bar exp" style="--pct:59%"><i></i></div>${withStats ? `<p class="stats hero-stats" data-hero-stats>${HERO_STATS}</p>` : ''}</div></div>
  </section>
  <section class="panel"><h3 class="engraved">Skills</h3><p class="group">Daily</p><ul>${SKILLS.map(skillRow).join('')}</ul><p class="group">Weekly</p><ul>${WEEKLY.map(skillRow).join('')}</ul></section>
  <section class="panel"><h3 class="engraved">Quests</h3><div class="quest"><span class="dia"></span><div><b>Finish the tax return</b><small>Due today</small></div></div><div class="quest soon"><span class="dia"></span><div><b>Fix the bike brakes</b><small>Due tomorrow</small></div></div></section>
  <section class="panel"><h3 class="engraved">Log</h3><ul class="log" style="margin-top:8px"><li>Used "Morning run" — dealt 486 damage</li><li>Healed +318 HP using "Meditate"</li><li>Boss #6 defeated! +212 EXP</li></ul></section>`;

// Boss panel geometry in px: inner padding and full height. The compact
// state is measured off the hero strip so the two pinned boxes match.
const PAD = 14, FULL_H = 248;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t * t * (3 - 2 * t);
const clamp01 = (t) => Math.min(1, Math.max(0, t));

const BOSS_MAX = 2210, HERO_MAX = 1980;

[
  ['row-top', 'Now', 0, false], ['row-top', 'With stats', 0, true],
  ['row-pinned', 'Now', 1.6, false], ['row-pinned', 'With stats', 1.6, true],
].forEach(([rowId, label, at, withStats]) => {
  const opt = document.createElement('div');
  opt.className = 'opt';
  opt.innerHTML = `<h2 class="engraved">${label}</h2><div class="phone"><div class="screen">${markup(withStats)}</div></div>`;
  document.getElementById(rowId).append(opt);

  const phone = opt.querySelector('.phone');
  const screen = opt.querySelector('.screen');
  const boss = screen.querySelector('[data-boss]');
  const frame = boss.querySelector('.boss-frame');
  const piece = (name) => boss.querySelector(`[data-piece="${name}"]`);
  const state = { boss: 1426, hero: 1642 };
  const heroPanel = screen.querySelector('.hero-pin');
  // Compact targets come from the hero strip (set up in measure()).
  let COMPACT_H = 80, collapse = FULL_H - COMPACT_H, C = null;

  boss.style.setProperty('--full-h', `${FULL_H}px`);

  function measure() {
    const hr = heroPanel.getBoundingClientRect();
    const rel = (el) => {
      const r = el.getBoundingClientRect();
      return { x: r.left - hr.left, y: r.top - hr.top, w: r.width, h: r.height };
    };
    COMPACT_H = heroPanel.offsetHeight;
    collapse = FULL_H - COMPACT_H;
    const heroName = heroPanel.querySelector('h3');
    C = {
      portrait: rel(heroPanel.querySelector('.mini')),
      name: rel(heroName),
      bar: rel(heroPanel.querySelector('[data-hero-bar]')),
      num: rel(heroPanel.querySelector('[data-hero-num]')),
      // The boss name shrinks to the hero name's size.
      nameScale: parseFloat(getComputedStyle(heroName).fontSize) / parseFloat(getComputedStyle(piece('name')).fontSize),
      stats: withStats ? rel(heroPanel.querySelector('[data-hero-stats]')) : null,
    };
    boss.style.top = `${-collapse}px`;
    // Overlaps the boss bar's bottom border by 1px so the two read as one header.
    heroPanel.style.top = `${COMPACT_H - 1}px`;
  }

  function paint() {
    piece('bar').querySelector('i').style.setProperty('--pct', `${(state.boss / BOSS_MAX) * 100}%`);
    piece('num').textContent = `${state.boss} / ${BOSS_MAX}`;
    screen.querySelector('[data-hero-bar] > i').style.setProperty('--pct', `${(state.hero / HERO_MAX) * 100}%`);
    screen.querySelector('[data-hero-num]').textContent = `${state.hero} / ${HERO_MAX}`;
  }

  // Everything is placed relative to the visible part of the panel, which
  // starts `off` px down once the panel has scrolled that far past its own top.
  //
  // Choreography, chosen so text never crosses the stage and nothing leaves
  // the frame. The stage shrinks in height steadily over the whole collapse
  // (so the boss shrinks evenly, never in a rush), and narrows only until
  // it's square (by 40%), then stays square down to the hero's portrait size.
  // The name block sits under the stage until then, sliding right; after,
  // it rises beside the stage, tracking its right edge.
  function place() {
    const off = Math.min(collapse, Math.max(0, screen.scrollTop - boss.offsetTop));
    const p = off / collapse;
    const t = ease(p);
    const w = boss.clientWidth;
    const nameW = piece('name').offsetWidth;
    const square = ease(clamp01(p / 0.4));
    boss.style.setProperty('--p', t);
    frame.style.setProperty('--frame-top', `${off}px`);

    const P = C.portrait;
    const sh = lerp(150, P.h, p);
    const sw = lerp(w, sh, square);
    const sx = lerp(0, P.x, square);
    const sy = lerp(0, P.y, p);
    const stage = piece('stage');
    Object.assign(stage.style, { left: `${sx}px`, top: `${off + sy}px`, width: `${sw}px`, height: `${sh}px` });
    const size = Math.min(118, sh - 8, sw - 6);
    Object.assign(piece('sprite').style, { width: `${size}px`, height: `${size}px`, marginBottom: `${lerp(6, 3, t)}px` });

    // Name block: below the stage until it's square, sliding toward where it
    // will start to rise; then beside the stage, tracking its right edge.
    const SPLIT = 0.4;
    const gap = C.name.x - (P.x + P.w);
    const besideX = sx + sw + gap;
    const riseX = P.x + lerp(150, P.h, SPLIT) + gap;
    const belowY = lerp(0, P.y, SPLIT) + lerp(150, P.h, SPLIT) + 10;
    let nameX, nameY;
    if (p <= SPLIT) {
      nameX = lerp((w - nameW) / 2, riseX, ease(p / SPLIT));
      nameY = lerp(160, belowY, p / SPLIT);
    } else {
      nameX = besideX;
      nameY = lerp(belowY, C.name.y, (p - SPLIT) / (1 - SPLIT));
    }
    const name = piece('name');
    name.style.left = `${nameX}px`;
    name.style.top = `${off + nameY}px`;
    name.style.transform = `scale(${lerp(1, C.nameScale, t)})`;

    const bar = piece('bar');
    const barX = p <= SPLIT ? lerp(PAD, riseX, ease(p / SPLIT)) : besideX;
    const barY = nameY + lerp(26, C.bar.y - C.name.y, t);
    const barRight = w - (C.bar.x + C.bar.w);
    Object.assign(bar.style, { left: `${barX}px`, top: `${off + barY}px`, width: `${w - barX - lerp(PAD, barRight, t)}px` });

    const num = piece('num');
    const numY = barY + lerp(12, C.num.y - C.bar.y, t);
    num.style.right = `${lerp(PAD, w - (C.num.x + C.num.w), t)}px`;
    num.style.top = `${off + numY}px`;

    // With stats: the boss's compact stats fade in beside the portrait at
    // the very end, on the hero stats' line, travelling with the name block.
    const cstats = piece('cstats');
    if (cstats) {
      cstats.style.left = `${besideX}px`;
      cstats.style.top = `${off + numY + (C.stats.y - C.num.y)}px`;
      cstats.style.opacity = clamp01((p - 0.8) / 0.2);
    }

    const stats = piece('stats');
    stats.style.left = `${PAD}px`;
    stats.style.right = `${PAD}px`;
    stats.style.top = `${off + nameY + 56}px`;
    // Gone within the first ~20px of scroll, before the shrinking frame reaches it.
    stats.style.opacity = Math.max(0, 1 - p / 0.1);
  }

  let queued = false;
  screen.addEventListener('scroll', () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; place(); });
  });

  function hit(dmg, type) {
    const healing = type === 'healing';
    if (healing) state.hero = Math.min(HERO_MAX, state.hero + dmg);
    else state.boss = Math.max(0, state.boss - Math.round(dmg / 3));
    paint();
    const target = healing ? screen.querySelector('[data-hero] .mini') : piece('stage');
    const fr = phone.getBoundingClientRect();
    const r = target.getBoundingClientRect();
    if (r.bottom < fr.top + 10 || r.top > fr.bottom - 10) return;
    const f = document.createElement('span');
    f.className = 'float';
    f.style.color = `var(--dmg-${type})`;
    f.textContent = healing ? `+${dmg}` : `-${dmg}`;
    f.style.left = `${r.left - fr.left + r.width / 2}px`;
    f.style.top = `${Math.max(6, r.top - fr.top + r.height * 0.35)}px`;
    phone.append(f);
    setTimeout(() => f.remove(), 1000);
    const shaker = healing ? target : piece('sprite');
    shaker.classList.remove('shake');
    void shaker.offsetWidth;
    shaker.classList.add('shake');
  }
  screen.querySelectorAll('.skill .dia').forEach((box) => box.addEventListener('change', () => {
    if (!box.checked) return;
    box.disabled = true;
    hit(Number(box.dataset.dmg), box.dataset.type);
  }));

  paint();
  document.fonts.ready.then(() => {
    measure();
    screen.scrollTop = boss.offsetTop + collapse * at;
    place();
  });
});
</script>
</body>
</html>
