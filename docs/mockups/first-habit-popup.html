<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — first habit popup (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* Four takes on a popup for a brand-new player with no habits yet, shown once
   after naming the hero. Goal: make it obvious that habits are added with
   "+ New habit" and that keeping them is how you fight. Phone width. */
:root {
  --bg: #0b0a09; --text: #a1988a; --text-h: #ece3cd; --bone: #d8cdb5;
  --gold: #c8a96e; --gold-hi: #e6cf9a; --gold-deep: #8a6d3c; --ember: #e0783a; --blood: #a8231d; --ash: #5c554a;
  --dmg-physical: #d0604f; --dmg-magic: #ab8dd8; --dmg-healing: #92bf88; --dmg-true: #f1e9d6;
  --line: rgba(200, 169, 110, 0.2); --line-mid: rgba(200, 169, 110, 0.4);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--bone); background: #070606; font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif; }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }

.page { max-width: 1700px; margin: 0 auto; padding: 30px 16px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: .32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin: 0 auto 26px; max-width: 760px; }
.opts { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; }
.opt { width: 375px; max-width: 100%; }
.opt > h2 { font-size: 12px; letter-spacing: .2em; color: var(--text-h); margin-bottom: 4px; }
.opt > h2 b { color: var(--gold); margin-right: 8px; }
.opt > p { font-style: italic; color: var(--text); font-size: 15px; margin-bottom: 12px; min-height: 62px; }

/* The phone, with a rough empty dashboard behind the popup. */
.screen { position: relative; height: 740px; background: #0b0a09; border: 1px solid rgba(200,169,110,.18); border-radius: 22px; overflow: hidden; }
.dash { position: absolute; inset: 0; }
.stage { position: relative; height: 230px; background: radial-gradient(ellipse 70% 60% at 50% 70%, rgba(80,50,30,.35), transparent 70%), linear-gradient(180deg, #14110e, #0b0a09); border-bottom: 1px solid var(--line); }
.stage .hero { position: absolute; left: 30px; bottom: 14px; width: 110px; image-rendering: pixelated; }
.stage .boss { position: absolute; right: 22px; bottom: 14px; width: 130px; image-rendering: pixelated; transform: scaleX(-1); }
.stage .hp { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; font: 600 10px/1 'Cinzel', serif; letter-spacing: .2em; color: var(--text); }
.panel { margin: 16px; padding: 14px 16px; border: 1px solid var(--line); }
.panel-h { display: flex; align-items: center; justify-content: space-between; }
.panel-h h3 { font: 600 13px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--text-h); }
.add { position: relative; padding: 8px 14px; font: 600 11px/1 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-hi); border: 1px solid var(--line-mid); background: rgba(200,169,110,.06); }
.panel .none { margin-top: 12px; font-style: italic; color: var(--text); font-size: 15px; }
.panel.q { opacity: .6; }

.veil { position: absolute; inset: 0; background: rgba(0,0,0,.72); }

.card { position: absolute; left: 18px; right: 18px; padding: 26px 22px 22px; text-align: center; border: 1px solid var(--line-mid); background: linear-gradient(180deg, #17130f, #0d0b09); box-shadow: 0 20px 60px -10px #000, inset 0 0 0 4px #0d0b09, inset 0 0 0 5px rgba(200,169,110,.14); }
.card h3 { font: 600 16px/1.2 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-h); }
.card .line { font-style: italic; color: var(--text); font-size: 17px; margin-top: 10px; }
.btn { display: block; width: 100%; min-height: 46px; margin-top: 20px; font: 600 12px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-hi); border: 1px solid var(--line-mid); background: linear-gradient(180deg, rgba(200,169,110,.12), rgba(200,169,110,.03)); box-shadow: 0 0 18px -6px rgba(230,199,127,.45); }
.later { display: block; margin: 8px auto 0; min-height: 44px; padding: 0 20px; font-style: italic; color: var(--text); font-size: 15px; }

/* ---------- A: Empty hands ---------- */
.A .card { top: 150px; }
.A .fire { position: relative; width: 120px; height: 110px; margin: 0 auto 12px; }
.A .fire::before { content: ''; position: absolute; inset: 0 -20px -10px; background: radial-gradient(closest-side at 50% 70%, rgba(224,120,58,.28), transparent); }
.A .fire img { position: relative; width: 120px; image-rendering: pixelated; margin-top: -10px; }
.A .steps { display: grid; gap: 10px; margin-top: 18px; text-align: left; }
.A .steps li { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--text-h); }
.A .steps i { flex-shrink: 0; width: 9px; height: 9px; transform: rotate(45deg); background: var(--gold); box-shadow: 0 0 8px rgba(230,207,154,.5); }
.A .steps i.d { background: var(--blood); box-shadow: 0 0 8px rgba(168,35,29,.6); }
.A ul { list-style: none; margin: 0; padding: 0; }

/* ---------- B: Spotlight ---------- */
.B .veil { background: none; }
.B .add.lit { z-index: 2; box-shadow: 0 0 0 9999px rgba(0,0,0,.78), 0 0 0 4px rgba(230,207,154,.25), 0 0 26px rgba(230,207,154,.55); }
.B .add.lit::after { content: ''; position: absolute; inset: -10px; border: 1px solid var(--gold); opacity: .6; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.85); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
.B .tip { position: absolute; z-index: 3; top: 318px; left: 18px; right: 18px; padding: 18px 18px 14px; text-align: left; border: 1px solid var(--line-mid); background: linear-gradient(180deg, #17130f, #0d0b09); box-shadow: 0 20px 50px -10px #000; }
.B .tip::before { content: ''; position: absolute; top: -8px; right: 54px; width: 14px; height: 14px; transform: rotate(45deg); background: #17130f; border-left: 1px solid var(--line-mid); border-top: 1px solid var(--line-mid); }
.B .tip h3 { font: 600 13px/1.2 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-hi); }
.B .tip p { margin-top: 6px; font-size: 17px; color: var(--text-h); }
.B .tip p span { color: var(--text); font-style: italic; }
.B .tip .row { display: flex; justify-content: flex-end; margin-top: 6px; }
.B .tip .later { margin: 0; padding: 0 4px; }

/* ---------- C: Starter sheet ---------- */
.C .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; text-align: center; border-top: 1px solid var(--line-mid); background: linear-gradient(180deg, #17130f, #0d0b09); box-shadow: 0 -20px 60px -10px #000; }
.C .grip { width: 40px; height: 4px; margin: 0 auto 18px; border-radius: 2px; background: var(--line-mid); }
.C .sheet h3 { font: 600 15px/1.2 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-h); }
.C .sheet .line { font-style: italic; color: var(--text); font-size: 16px; margin-top: 8px; }
.C .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.C .chip { display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 12px; text-align: left; font-size: 16px; color: var(--text-h); border: 1px solid var(--line); background: rgba(200,169,110,.04); }
.C .chip .dot { width: 8px; height: 8px; transform: rotate(45deg); background: var(--c); flex-shrink: 0; box-shadow: 0 0 6px var(--c); }
.C .chip small { display: block; color: var(--text); font-style: italic; font-size: 13px; }
.C .own { margin-top: 10px; }

/* ---------- D: Boss taunt ---------- */
.D .card { top: 130px; padding-top: 0; }
.D .bossimg { display: block; width: 150px; margin: -60px auto 4px; image-rendering: pixelated; transform: scaleX(-1); filter: drop-shadow(0 0 18px rgba(168,35,29,.45)); }
.D .taunt { font: italic 600 24px/1.2 'Cormorant Garamond', serif; color: var(--blood); text-shadow: 0 0 16px rgba(168,35,29,.5); }
.D .card .line { margin-top: 14px; }
.D .ledger { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 0 12px; margin-top: 18px; }
.D .ledger .rule { background: linear-gradient(180deg, transparent, var(--line-mid), transparent); }
.D .ledger b { display: block; font: 600 10px/1 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; margin-bottom: 6px; }
.D .ledger .k b { color: var(--gold-hi); }
.D .ledger .m b { color: var(--blood); }
.D .ledger span { font-size: 15px; color: var(--text-h); }
</style>
</head>
<body>
<div class="page">
  <h1 class="engraved">First habit popup · round 1</h1>
  <p>Shown once to a brand-new player, right after naming the hero, while they have no habits. Each button opens the existing Add habit popup.</p>
  <div class="opts" id="opts"></div>
</div>

<script>
const SPR = '../../public/sprites/';
const dash = (lit) => `
  <div class="dash">
    <div class="stage">
      <div class="hp"><span>Nameless</span><span>Boss 1</span></div>
      <img class="hero" src="${SPR}player/warrior.png" alt="">
      <img class="boss" src="${SPR}bosses/brute.png" alt="">
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Skills</h3><button class="add${lit ? ' lit' : ''}">+ New habit</button></div>
      <p class="none">No habits yet — tap + to add one.</p>
    </div>
    <div class="panel q"><div class="panel-h"><h3>Quests</h3></div></div>
  </div>`;

const OPTS = [
  {
    k: 'A', name: 'Empty hands',
    note: 'A centered popup by the fire. Three short lines say how the game works, with one button that goes straight to adding a habit.',
    body: `${dash()}<div class="veil"></div>
      <div class="card">
        <div class="fire"><img src="${SPR}player/warrior.png" alt=""></div>
        <h3>Your hands are empty</h3>
        <p class="line">Your habits are your weapons.</p>
        <ul class="steps">
          <li><i></i>Add a habit you want to keep.</li>
          <li><i></i>Keep it, and you strike the boss.</li>
          <li><i class="d"></i>Break it, and the boss strikes back.</li>
        </ul>
        <button class="btn">Add a habit</button>
        <button class="later">Later</button>
      </div>`,
  },
  {
    k: 'B', name: 'Spotlight',
    note: 'No modal: the screen darkens except for the real “+ New habit” button, which pulses. A small callout points at it. Tapping the button itself carries on.',
    body: `${dash(true)}
      <div class="tip">
        <h3>Start here</h3>
        <p>Add a habit you want to keep. <span>Each day you keep it, you strike.</span></p>
        <div class="row"><button class="later">Later</button></div>
      </div>`,
  },
  {
    k: 'C', name: 'Starter sheet',
    note: 'A bottom sheet with a few starter habits to tap, so the first one takes a single tap. A pick opens Add habit filled in. Or write your own.',
    body: `${dash()}<div class="veil"></div>
      <div class="sheet">
        <div class="grip"></div>
        <h3>Choose your first weapon</h3>
        <p class="line">Pick a habit to keep, or write your own.</p>
        <div class="chips">
          <button class="chip" style="--c: var(--dmg-physical)"><span class="dot"></span><span>Walk<small>daily</small></span></button>
          <button class="chip" style="--c: var(--dmg-magic)"><span class="dot"></span><span>Read<small>daily</small></span></button>
          <button class="chip" style="--c: var(--dmg-healing)"><span class="dot"></span><span>Drink water<small>daily</small></span></button>
          <button class="chip" style="--c: var(--dmg-true)"><span class="dot"></span><span>Call family<small>weekly</small></span></button>
        </div>
        <button class="btn own">Write your own</button>
      </div>`,
  },
  {
    k: 'D', name: 'Boss taunt',
    note: 'The first boss leans in and mocks the empty-handed hero. A kept / broken ledger says what habits do. Most in-world, a little less direct.',
    body: `${dash()}<div class="veil"></div>
      <div class="card">
        <img class="bossimg" src="${SPR}bosses/brute.png" alt="">
        <p class="taunt">“You come unarmed?”</p>
        <p class="line">Add a habit. Every habit is a weapon.</p>
        <div class="ledger">
          <div class="k"><b>Kept</b><span>you strike</span></div>
          <div class="rule"></div>
          <div class="m"><b>Broken</b><span>it strikes you</span></div>
        </div>
        <button class="btn">Arm yourself</button>
        <button class="later">Later</button>
      </div>`,
  },
];

document.getElementById('opts').innerHTML = OPTS.map((o) => `
  <div class="opt ${o.k}">
    <h2 class="engraved"><b>${o.k}</b>${o.name}</h2>
    <p>${o.note}</p>
    <div class="screen">${o.body}</div>
  </div>`).join('');
</script>
</body>
</html>
