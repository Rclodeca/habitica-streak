<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habitica Streak — crowded skills, round 3 (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* Round 2: difficulty leaves the skill row (modal only) and its diamonds
   show rank instead, 1-8. Four compact layouts for the diamonds, then the
   whole skill modal in two layouts. Phone width. Icons are stand-ins. */
:root {
  --bg: #0b0a09; --text: #a1988a; --text-h: #ece3cd; --bone: #d8cdb5;
  --gold: #c8a96e; --gold-hi: #e6cf9a; --gold-deep: #8a6a2c; --ash: #5c554a; --blood: #c8402f; --ember: #e0783a;
  --dmg-physical: #d0604f; --dmg-magic: #ab8dd8; --dmg-healing: #92bf88; --dmg-true: #f1e9d6;
  --line: rgba(200, 169, 110, 0.2); --line-mid: rgba(200, 169, 110, 0.4);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--bone); background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200,169,110,.1), transparent 70%), #070606; font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif; }
h1, h2, h3, p, dl, dd { margin: 0; font-weight: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
.page { max-width: 1240px; margin: 0 auto; padding: 30px 16px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: .32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin-bottom: 30px; }
section.sec { margin-bottom: 52px; }
section.sec > h2 { font-size: 12px; letter-spacing: .22em; color: var(--text-h); margin-bottom: 4px; }
section.sec > p { font-style: italic; color: var(--text); font-size: 15px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px 24px; justify-items: center; }
.opt { display: flex; flex-direction: column; gap: 10px; width: 360px; max-width: 100%; }
.opt h3 { font: 600 12px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--text-h); }
.opt h3 b { color: var(--gold); font-weight: 600; margin-right: 6px; }
.opt > p { font-style: italic; color: var(--text); font-size: 15px; line-height: 1.3; }

.corners::before { content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: .75;
  background: linear-gradient(var(--gold),var(--gold)) top left/10px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) top left/1px 10px no-repeat,
    linear-gradient(var(--gold),var(--gold)) top right/10px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) top right/1px 10px no-repeat,
    linear-gradient(var(--gold),var(--gold)) bottom left/10px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) bottom left/1px 10px no-repeat,
    linear-gradient(var(--gold),var(--gold)) bottom right/10px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) bottom right/1px 10px no-repeat; }
.panel { position: relative; padding: 12px; background: linear-gradient(180deg, rgba(27,24,21,.96), rgba(14,13,11,.98)); border: 1px solid var(--line); }
.panel > h4 { font: 600 11px/1 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-hi); margin-bottom: 4px; }

/* ---------- skill row (no difficulty pips) ---------- */
.skill { position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 4px 6px 6px; }
.skill.bad::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--blood); box-shadow: 0 0 8px var(--blood); }
.dia { flex-shrink: 0; width: 13px; height: 13px; margin: 0 5px; transform: rotate(45deg); border: 1px solid var(--gold); background: rgba(0,0,0,.45); }
.skill .name { flex: 1; min-width: 0; font-weight: 600; color: var(--text-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skill .meta { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.streak { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; color: var(--text); }
.streak svg { width: 11px; height: 11px; }
.hit { width: 52px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.physical .hit { color: var(--dmg-physical); } .magic .hit { color: var(--dmg-magic); }
.healing .hit { color: var(--dmg-healing); } .true .hit { color: var(--dmg-true); }

/* rank diamonds: a lit gold pip, same family as the old difficulty pips */
.rk { position: relative; display: inline-block; flex-shrink: 0; }
.rk i { position: absolute; width: 6px; height: 6px; transform: rotate(45deg); background: radial-gradient(circle, var(--gold-hi), var(--gold) 60%, var(--gold-deep)); box-shadow: 0 0 5px rgba(230,207,154,.35); }
.rk i.big { width: 11px; height: 11px; box-shadow: 0 0 8px rgba(230,207,154,.5); }
.rk i.off { background: transparent; border: 1px solid var(--line-mid); box-shadow: none; }

/* ---------- modal ---------- */
.screen { position: relative; width: 360px; max-width: 100%; padding: 26px 14px; background: rgba(0,0,0,.72); border: 1px solid rgba(200,169,110,.12); border-radius: 22px; }
.modal { position: relative; padding: 16px 16px 14px; background: linear-gradient(180deg, rgba(24,21,18,.985), rgba(10,9,8,.985)); border: 1px solid var(--line-mid); box-shadow: 0 40px 80px -30px #000, 0 0 0 4px rgba(0,0,0,.6), 0 0 0 5px rgba(200,169,110,.13); }
.m-head { position: relative; display: flex; align-items: center; gap: 14px; margin: 2px 0 10px; padding-inline: 2rem; font: 600 13px/1.2 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-hi); text-align: center; }
.m-head::before, .m-head::after { content: ''; flex: 1; min-width: 12px; height: 1px; background: linear-gradient(90deg, transparent, var(--line-mid)); }
.m-head::after { background: linear-gradient(270deg, transparent, var(--line-mid)); }
.m-close { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); color: var(--text); font: 400 20px/1 serif; letter-spacing: 0; }
.m-meta { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; font: 600 10px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--text); }
.m-meta .ic { width: 13px; height: 13px; border: 1px solid currentColor; border-radius: 50%; }
.m-meta .pips { display: inline-flex; gap: 4px; }
.m-meta .pip { width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--line-mid); }
.m-meta .pip.lit { background: var(--gold); border-color: var(--gold); }

.rank-block { margin: 0 0 14px; padding: 10px 10px 9px; border: 1px solid var(--line); background: rgba(0,0,0,.28); }
.rank-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.rank-top .lab { font: 600 11px/1 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-hi); }
.bar { height: 4px; background: rgba(0,0,0,.55); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-hi)); box-shadow: 0 0 6px rgba(230,207,154,.4); }
.bar-cap { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: var(--text); font-style: italic; }
.bar-cap b { font-style: normal; color: var(--gold); font-weight: 600; }

.days-lab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 14px; color: var(--text); }
.days-lab span:first-child { font: 600 10px/1 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; }
.days-lab span:last-child { font-style: italic; }
.days { display: flex; justify-content: space-between; margin: 0 6px 18px; }
.day { position: relative; display: grid; place-items: center; width: 34px; height: 34px; font: 600 10px/1 'Cinzel', serif; color: var(--text); }
.day::before { content: ''; position: absolute; width: 24px; height: 24px; transform: rotate(45deg); border: 1px solid var(--ash); background: rgba(0,0,0,.35); }
.day.on { color: var(--gold-hi); }
.day.on::before { border-color: var(--gold); background: radial-gradient(circle, rgba(230,207,154,.35), rgba(138,106,44,.2) 70%); box-shadow: 0 0 10px -2px rgba(230,199,127,.5); }
.day span { position: relative; }

.sum { display: grid; gap: 7px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.row dt { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text-h); }
.row dt .ic { width: 13px; height: 13px; border: 1px solid var(--gold); border-radius: 50%; opacity: .8; }
.row dt small { color: var(--text); font-size: .95em; font-weight: 500; font-style: italic; }
.row dd { font: 600 14.5px/1 'Cinzel', serif; color: var(--gold-hi); letter-spacing: .02em; }
.row.base dd { color: var(--text-h); }
.row.crowd dd { color: #c98d7c; }
.row .barwrap { flex-basis: 100%; margin-top: 2px; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line-mid); }
.total dt { font: 600 10px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--text); }
.total dd { font-size: 27px; font-weight: 700; color: var(--c); }

.od { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; padding: 11px; border: 1px solid rgba(224,120,58,.7); background: linear-gradient(180deg, rgba(160,60,20,.35), rgba(90,30,10,.35)); font: 600 11px/1 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; color: var(--text-h); box-shadow: 0 0 14px 1px rgba(224,120,58,.45); }
.od .charges { display: inline-flex; gap: 6px; }
.od .charge { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid #f2b48a; background: radial-gradient(circle, #ffe2c4 0, var(--ember) 45%, #7a2e10 85%); box-shadow: 0 0 8px 1px rgba(224,120,58,.6); }
.od .charge.used { background: none; border-color: var(--ash); box-shadow: none; }
.od small { font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: .05em; color: var(--gold-hi); text-transform: none; }
.remove { margin-top: 12px; text-align: center; font: 600 9.5px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: rgba(200,64,47,.8); }
.remove.locked { color: var(--ash); }
.remove.locked small { display: block; margin-top: 5px; font: italic 500 13px/1 'Cormorant Garamond', serif; letter-spacing: 0; text-transform: none; color: var(--text); }
#modals { max-width: 800px; margin: 0 auto; }
.tag { margin-top: 8px; font: 600 9px/1 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; color: var(--text); text-align: center; opacity: .75; }
</style>
<style>
/* Round 3: four ways to say a skill is crowded (16th+ skill). Its Base is
   already lowered; no separate line. Rows use the picked one-line diamonds,
   modals the picked layout A. */
.skill.c-ash .name, .skill.c-ash .hit { color: var(--ash) !important; }
.skill.c-ash .dia { border-color: var(--ash); }
.row.base.c-ash dd { color: var(--ash); }
.row.base small.cr { color: var(--ash); font-style: italic; font-weight: 500; }

.struck { color: var(--ash); text-decoration: line-through; text-decoration-color: rgba(200,64,47,.7); font-size: .85em; margin-right: 6px; }
.twin { position: relative; }
.twin::after { content: ''; position: absolute; left: 4px; top: -4px; width: 13px; height: 13px; border: 1px solid var(--ash); transform: none; }
.skill.c-twin .dia { box-shadow: 4px -4px 0 -1px var(--bg), 4px -4px 0 0 var(--ash); }
.skill .sub { display: block; font: 600 8px/1 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ash); margin-top: 3px; }
.skill .namebox { flex: 1; min-width: 0; }
.skill .namebox .name { display: block; }
.chip { display: inline-flex; align-items: center; gap: 5px; margin: -6px auto 12px; padding: 2px 10px; border: 1px solid rgba(92,85,74,.8); background: rgba(92,85,74,.15); border-radius: 999px; font: 600 9px/1.4 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; color: var(--text); }
.chipwrap { text-align: center; }
.hit { width: auto; min-width: 52px; white-space: nowrap; }
.crowd-glyph { display: inline-block; position: relative; width: 12px; height: 9px; margin-right: 4px; vertical-align: middle; }
.crowd-glyph i { position: absolute; top: 2px; width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--ash); }
.crowd-glyph i:nth-child(1) { left: 0; } .crowd-glyph i:nth-child(2) { left: 3.5px; } .crowd-glyph i:nth-child(3) { left: 7px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="flame" viewBox="0 0 12 12"><path d="M6 1c1 2 3 3 3 6a3 3 0 0 1-6 0c0-1.5.8-2.3 1.4-3 .2 1 .7 1.5 1.2 1.6C5.4 4 5.4 2.6 6 1z" fill="currentColor"/></symbol></svg>
<div class="page">
  <h1 class="engraved">Crowded skills · round 3</h1>
  <p>Past your 15th skill, the newest skills are crowded: their Base is lower (×0.7, ×0.5, ...), with no separate line. Four ways to show it. The last two rows are your 16th and 17th skills.</p>
  <div class="grid" id="opts"></div>
</div>
<script>
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
const SKILLS = [
  { name: 'Morning run', type: 'physical', rank: 5, streak: 112, hit: '7,120' },
  { name: 'Read 20 pages', type: 'magic', rank: 3, streak: 4, hit: '4,040' },
  { name: 'Meditate', type: 'healing', rank: 2, streak: 23, hit: '690' },
  { name: 'Floss', type: 'physical', rank: 2, streak: 14, hit: '2,563', crowded: 0.5, full: '5,126' },
  { name: 'Evening walk', type: 'healing', rank: 0, streak: 0, hit: '356', crowded: 0.7, full: '508' },
];
const diamonds = (r) => (r ? `<span class="rk" style="width:${r * 7.5}px;height:10px">${Array.from({ length: r }, (_, i) => `<i style="left:${i * 7.5}px;top:2px"></i>`).join('')}</span>` : '');
const streak = (s) => (s >= 3 ? `<span class="streak"><svg><use href="#flame"/></svg>${s}</span>` : '');
const glyph = '<span class="crowd-glyph"><i></i><i></i><i></i></span>';

const OPTS = {
  ash: { title: 'Ash', note: 'A crowded skill goes ash grey on the row: name, check and hit. In the modal its Base is ash, with a quiet "crowded" note.',
    row: (s) => ({ cls: s.crowded ? 'c-ash' : '', name: s.name, hit: s.hit }),
    base: (m) => `<div class="row base c-ash"><dt>Base<small class="cr">crowded</small></dt><dd>${m.base}</dd></div>`, chip: '' },
  struck: { title: 'Struck', note: 'The row shows a small three-diamond mark before the hit. The modal shows the full Base struck through, then the crowded one.',
    row: (s) => ({ cls: '', name: s.name, hit: s.crowded ? glyph + s.hit : s.hit }),
    base: (m) => `<div class="row base"><dt>Base</dt><dd><span class="struck">${m.full}</span>${m.base}</dd></div>`, chip: '' },
  tag: { title: 'Tag', note: 'A tiny engraved "Crowded" under the name on the row, and the same word as a chip under the modal title. Base is just lower.',
    row: (s) => ({ cls: '', name: s.name, sub: s.crowded ? 'Crowded' : '', hit: s.hit }),
    base: (m) => `<div class="row base"><dt>Base</dt><dd>${m.base}</dd></div>`, chip: '<div class="chipwrap"><span class="chip">Crowded</span></div>' },
  twin: { title: 'Twin', note: 'The check diamond gets a faint second diamond behind it, crowded in. Quietest on the row; the modal\'s Base gets the same mark.',
    row: (s) => ({ cls: s.crowded ? 'c-twin' : '', name: s.name, hit: s.hit }),
    base: (m) => `<div class="row base"><dt>Base${glyph}</dt><dd>${m.base}</dd></div>`, chip: '' },
};
const M = { name: 'Floss', type: 'Physical', color: 'var(--dmg-physical)', pips: 1, rank: 2, streak: 14, next: 30, full: '1,361', base: '680', total: '2,563', dayLabel: 'Every day' };
const LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
function modal(o) {
  const pct = (M.streak / M.next) * 100;
  return `<div class="screen"><div class="modal corners">
    <div class="m-head">${M.name}<span class="m-close">×</span></div>
    <div class="m-meta"><span class="ic" style="color:${M.color}"></span><span>${M.type}</span><span class="pips">${[1, 2, 3].map((n) => `<span class="pip ${n <= M.pips ? 'lit' : ''}"></span>`).join('')}</span></div>
    ${o.chip}
    <div class="rank-block"><div class="rank-top"><span class="lab">Rank ${ROMAN[M.rank]}</span>${diamonds(M.rank)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="bar-cap"><span>${M.streak}</span><span><b>III</b> at ${M.next}</span></div></div>
    <div class="days-lab"><span>Days</span><span>${M.dayLabel}</span></div>
    <div class="days">${LETTERS.map((l) => `<span class="day on"><span>${l}</span></span>`).join('')}</div>
    <dl class="sum">${o.base({ ...M })}
      <div class="row"><dt><span class="ic"></span>Rank<small>II</small></dt><dd>+200%</dd></div>
      <div class="row"><dt><span class="ic"></span>Streak<small>14</small></dt><dd>+14%</dd></div>
      <div class="row"><dt><span class="ic"></span>Gear</dt><dd>×1.2</dd></div>
      <div class="total" style="--c:${M.color}"><dt>Strikes for</dt><dd>${M.total}</dd></div></dl>
    <div class="remove">Remove habit</div></div></div>`;
}
document.getElementById('opts').innerHTML = Object.values(OPTS).map((o, i) => `
  <div class="opt"><h3><b>${'ABCD'[i]}</b>${o.title}</h3><p>${o.note}</p>
    <div class="panel corners"><h4>Skills</h4><ul>${SKILLS.map((s) => { const r = o.row(s);
      return `<li class="skill ${s.type} ${r.cls}"><span class="dia"></span><span class="namebox"><span class="name">${r.name}</span>${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</span>
        <span class="meta">${streak(s.streak)}${diamonds(s.rank)}</span><span class="hit">${r.hit}</span></li>`; }).join('')}</ul></div>
    ${modal(o)}</div>`).join('');
</script>
</body>
</html>
