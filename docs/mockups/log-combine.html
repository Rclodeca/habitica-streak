<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — combined log lines (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* Same 4 actions in every phone, newest first:
   1. Skill hit that crit, lifestole and got reflected (+ milestone EXP)
   2. Missed habit: boss crit + boss lifesteal
   3. Plain skill hit
   4. Heal */
:root {
  --bg: #0b0a09; --text: #a1988a; --text-h: #ece3cd; --bone: #d8cdb5;
  --gold: #c8a96e; --gold-hi: #e6cf9a; --ember: #e0783a; --blood: #c8402f; --ash: #5c554a;
  --heal: #92bf88; --exp: #e6cf9a; --magic: #8f8ad8;
  --line: rgba(200, 169, 110, 0.2); --line-mid: rgba(200, 169, 110, 0.4); --line-faint: rgba(200, 169, 110, 0.07);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--bone); background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200,169,110,.1), transparent 70%), #070606; font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif; }
h1, h2, p { margin: 0; font-weight: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }

.page { max-width: 1400px; margin: 0 auto; padding: 30px 16px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: .32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin-bottom: 26px; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { display: flex; flex-direction: column; gap: 12px; width: 343px; max-width: 100%; }
.opt h2 { font-size: 12px; letter-spacing: .2em; color: var(--text-h); }
.opt h2 b { color: var(--gold); font-weight: 600; margin-right: 8px; }
.opt > p { font-style: italic; color: var(--text); font-size: 16px; line-height: 1.3; min-height: 2.6em; }

/* Log panel, as Ashen styles it. */
.panel { position: relative; padding: 14px 14px 10px; background: linear-gradient(180deg, rgb(27,24,21), rgb(14,13,11)); border: 1px solid var(--line); box-shadow: 0 24px 50px -24px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,236,200,.04); }
.panel::before { content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: .75;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 12px no-repeat; }
.panel h2 { font: 600 13.5px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-hi); margin-bottom: 8px; }
.log li { padding: 5px 0; border-bottom: 1px solid var(--line-faint); font-size: 13.6px; line-height: 1.4; font-style: italic; color: var(--text); }
.log li:last-child { border-bottom: 0; }
.log b { font-style: normal; font-weight: 700; }
.d { color: var(--blood); } .h { color: var(--heal); } .x { color: var(--exp); } .c { color: var(--ember); }
.ic { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; }
.ic.s { width: 11px; height: 11px; margin-right: 3px; }

/* B: sub-lines under the headline. */
.sub { display: block; margin-left: 19px; font-size: 12.6px; color: var(--ash); }
.sub + .sub { margin-top: 1px; }

/* C: chips on a second row. */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0 0 19px; }
.chip { display: inline-flex; align-items: center; padding: 1px 6px; border: 1px solid var(--line); font-size: 12px; font-style: normal; line-height: 1.35; color: var(--text); }
.chip.crit { border-color: rgba(224,120,58,.45); color: var(--ember); }

/* D: CRIT tag before the number. */
.tag { font: 600 9px/1 'Cinzel', serif; letter-spacing: .14em; font-style: normal; color: var(--ember); border: 1px solid rgba(224,120,58,.5); padding: 2px 3px 1px; margin-right: 3px; vertical-align: 1px; }
</style>
</head>
<body>
<div class="page">
  <h1 class="engraved">Combined log lines</h1>
  <p>Same four actions in each. The top two are the ones that merge.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const I = {
  phys: '<svg viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="2" stroke-linecap="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg>',
  magic: '<svg viewBox="0 0 24 24" fill="none" stroke="#8f8ad8" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  heal: '<svg viewBox="0 0 24 24" fill="none" stroke="#92bf88" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  crit: '<svg viewBox="0 0 24 24" fill="none" stroke="#e0783a" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  steal: '<svg viewBox="0 0 24 24" fill="none" stroke="#92bf88" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  refl: '<svg viewBox="0 0 24 24" fill="none" stroke="#c8402f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
};
const ic = (k, s) => `<i class="ic${s ? ' s' : ''}">${I[k]}</i>`;

// The two rows that don't change between options.
const TAIL = `
  <li>${ic('phys')}Used "Read 20 pages" — dealt <b class="d">274</b> damage</li>
  <li>${ic('heal')}Healed <b class="h">+338</b> HP using "Meditate"</li>`;

const OPTS = [
  {
    k: '0', t: 'Today', p: 'One row per effect. Seven rows for four actions; the hit and its crit read as separate events.',
    rows: `
      <li>${ic('phys')}Used "Morning run" — dealt <b class="d">1587</b> damage · <b class="x">+42</b> EXP</li>
      <li>${ic('refl')}Boss reflected <b class="d">120</b> damage back at you</li>
      <li>${ic('steal')}Lifesteal healed you for <b class="h">+80</b> HP</li>
      <li>${ic('crit')}Critical hit!</li>
      <li>${ic('magic')}Magic hit for <b class="d">412</b> damage (missed "No phone in bed")</li>
      <li>${ic('steal')}Lifesteal restored the boss for <b class="h">+95</b> HP</li>
      <li>${ic('crit')}Boss lands a critical hit!</li>`,
  },
  {
    k: 'A', t: 'One sentence', p: 'Everything folded into the headline. Fewest rows; long hits wrap to two lines.',
    rows: `
      <li>${ic('phys')}"Morning run" <b class="c">crits</b> for <b class="d">1587</b> · stole <b class="h">+80</b> HP · <b class="d">120</b> reflected · <b class="x">+42</b> EXP</li>
      <li>${ic('magic')}Missed "No phone in bed" — boss <b class="c">crits</b> for <b class="d">412</b> · stole <b class="h">+95</b> HP</li>`,
  },
  {
    k: 'B', t: 'Headline + sub-lines', p: 'Headline as today, extras indented underneath in small ash text. Crit lives on the headline.',
    rows: `
      <li>${ic('phys')}Used "Morning run" — <b class="c">critical</b> <b class="d">1587</b> damage · <b class="x">+42</b> EXP
        <span class="sub">${ic('steal', 1)}Lifesteal <b class="h">+80</b> HP</span>
        <span class="sub">${ic('refl', 1)}Reflected <b class="d">120</b> back at you</span></li>
      <li>${ic('magic')}Missed "No phone in bed" — boss <b class="c">critical</b> <b class="d">412</b> damage
        <span class="sub">${ic('steal', 1)}Boss stole <b class="h">+95</b> HP</span></li>`,
  },
  {
    k: 'C', t: 'Headline + chips', p: 'Headline stays short; each extra becomes a small chip on the row below.',
    rows: `
      <li>${ic('phys')}Used "Morning run" — dealt <b class="d">1587</b> damage
        <span class="chips"><span class="chip crit">${ic('crit', 1)}Crit</span><span class="chip">${ic('steal', 1)}<b class="h">+80</b>&nbsp;HP</span><span class="chip">${ic('refl', 1)}<b class="d">−120</b>&nbsp;HP</span><span class="chip"><b class="x">+42</b>&nbsp;EXP</span></span></li>
      <li>${ic('magic')}Missed "No phone in bed" — took <b class="d">412</b> damage
        <span class="chips"><span class="chip crit">${ic('crit', 1)}Crit</span><span class="chip">${ic('steal', 1)}Boss <b class="h">+95</b>&nbsp;HP</span></span></li>`,
  },
  {
    k: 'D', t: 'Crit tag + tail', p: 'A small CRIT tag before the number; lifesteal and reflect trail the line with icons only.',
    rows: `
      <li>${ic('phys')}Used "Morning run" — <span class="tag">CRIT</span><b class="d">1587</b> damage · ${ic('steal', 1)}<b class="h">+80</b> · ${ic('refl', 1)}<b class="d">−120</b> · <b class="x">+42</b> EXP</li>
      <li>${ic('magic')}Missed "No phone in bed" — <span class="tag">CRIT</span><b class="d">412</b> damage · ${ic('steal', 1)}boss <b class="h">+95</b></li>`,
  },
];

document.getElementById('grid').innerHTML = OPTS.map(o => `
  <div class="opt">
    <h2 class="engraved"><b>${o.k}</b>${o.t}</h2>
    <p>${o.p}</p>
    <section class="panel">
      <h2>Log</h2>
      <ul class="log">${o.rows}${TAIL}</ul>
    </section>
  </div>`).join('');
</script>
</body>
</html>
