<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — boss-only battle bar (Ashen)</title>
<style>
/* The phone screen lives in boss-bar-only.screen.html: today's app, captured
   from the dev server, with the pinning changed. Framed here at phone width so
   the app's phone layout (max-width 820px) applies. */
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 30px 16px 60px; box-sizing: border-box;
  color: #a1988a; background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200, 169, 110, 0.1), transparent 70%), #070606;
  font: italic 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif;
}
h1 { margin: 0; font: 600 14px/1 Cinzel, Georgia, serif; letter-spacing: 0.32em; text-transform: uppercase; color: #e6cf9a; }
p { margin: 0; max-width: 390px; text-align: center; }
.phone {
  width: 390px; max-width: 100%; height: 844px; overflow: hidden; border-radius: 34px;
  border: 1px solid rgba(200, 169, 110, 0.3); box-shadow: 0 30px 60px -20px #000, 0 0 0 6px #141210, 0 0 0 7px rgba(200, 169, 110, 0.15);
}
.phone iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <h1>Boss-only battle bar</h1>
  <p>Today's main screen, but nothing condenses. Scroll past the boss and its bar drops in; the hero scrolls away. Tick a skill to land a hit.</p>
  <div class="phone"><iframe src="boss-bar-only.screen.html" title="Phone screen"></iframe></div>
</body>
</html>
