<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — gear icons (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* The character modal's Equipment rows, with different treatments for the item
   icon. The art is 80x80 pixel art saved at 3x (240px files) with the item in
   the middle ~34px. Today it renders at ~1.53 screen px per art pixel, which
   is uneven, so one-pixel lines (staffs, blades) come out thin and blotchy.
   Every option after A draws the art at exactly 2 screen px per art pixel. */
:root {
  --bg: #0b0a09; --text: #a1988a; --text-h: #ece3cd; --bone: #d8cdb5;
  --gold: #c8a96e; --gold-hi: #e6cf9a;
  --rarity-common: #8d8475; --rarity-uncommon: #86b08b; --rarity-rare: #7f9fd1; --rarity-epic: #ae8bd6;
  --bad: #d0604f;
  --line: rgba(200, 169, 110, 0.2); --line-mid: rgba(200, 169, 110, 0.4);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--bone); background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200,169,110,.1), transparent 70%), #070606; font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif; }
h1, h2, h3, h4, p { margin: 0; font-weight: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }

.page { max-width: 1400px; margin: 0 auto; padding: 30px 16px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: .32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin-bottom: 26px; }
.cards { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
.opt { width: 360px; max-width: 100%; }
.opt > h2 { font-size: 12px; letter-spacing: .2em; color: var(--text-h); margin-bottom: 4px; }
.opt > h2 b { color: var(--gold); margin-right: 8px; }
.opt > p { font-style: italic; color: var(--text); font-size: 15px; margin-bottom: 10px; min-height: 60px; }

.modal { position: relative; padding: 14px 12px; background: linear-gradient(180deg, rgba(27,24,21,.97), rgba(14,13,11,.99)); border: 1px solid var(--line); }
.modal::before { content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: .75;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 10px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 10px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 10px no-repeat; }
.group-label { margin: 0 0 6px; font: 600 10px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--text); }

/* Live gear row, Ashen. */
.gear-list { display: flex; flex-direction: column; gap: 6px; }
.gear-row { --r: var(--rarity-common); display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-left: 2px solid var(--r); border-radius: 8px; }
.gear-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.gear-name { color: var(--text-h); font-weight: 700; }
.gear-rarity { margin-left: 6px; font: 600 9px/1 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: var(--r); }
.gear-bonuses { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.gear-bonus { display: inline-flex; align-items: center; gap: 5px; color: var(--text-h); font-size: 14px; }
.gear-bonus .ic { display: inline-grid; place-items: center; color: var(--k); line-height: 0; }
.gear-bonus .lab { color: var(--text); }
.gear-bonus.neg { color: var(--bad); }
.gear-effect { color: var(--r); font-size: 13px; font-style: italic; }

/* The icon box. */
.gear-icon { position: relative; flex-shrink: 0; width: 72px; height: 72px; display: grid; place-items: center; }
.gear-icon img { image-rendering: pixelated; pointer-events: none; }

/* A: today. */
.today .gear-icon { background: radial-gradient(circle, color-mix(in srgb, var(--r) 28%, transparent), transparent 70%); border-radius: 8px; }
.today .gear-icon img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.7); }

/* Every other option: whole-pixel 2x. The 240px file is 80 art px, so 160px
   wide puts each art pixel on a 2x2 block and the item at ~68px. */
.crisp .gear-icon img { position: absolute; left: 50%; top: 50%; width: 160px; height: 160px; margin: -80px 0 0 -80px; }
.crisp .gear-icon { background: radial-gradient(circle, color-mix(in srgb, var(--r) 28%, transparent), transparent 70%); border-radius: 8px; }

/* C: an inventory well. Dark recessed square, rarity hairline, inner bevel. */
.well .gear-icon { width: 80px; height: 80px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--r) 55%, transparent);
  background: radial-gradient(circle, color-mix(in srgb, var(--r) 22%, transparent), rgba(0,0,0,.55) 72%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.55), inset 0 0 0 4px color-mix(in srgb, var(--r) 22%, transparent), 0 0 14px -6px var(--r); }
.well .gear-icon::before { content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: .9;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 7px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 7px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 7px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 7px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 7px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 7px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 7px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 7px no-repeat; }

/* D: outlined art. A one-art-pixel rim in a dark rarity tone thickens every
   silhouette; could be baked into the PNGs instead of four drop-shadows. */
.outline .gear-icon img { filter:
  drop-shadow(2px 0 0 var(--rim)) drop-shadow(-2px 0 0 var(--rim)) drop-shadow(0 2px 0 var(--rim)) drop-shadow(0 -2px 0 var(--rim))
  drop-shadow(0 0 6px color-mix(in srgb, var(--r) 45%, transparent)); }
.outline .gear-row { --rim: color-mix(in srgb, var(--r) 55%, #000); }

/* E: the lit diamond from the Item found popup, shrunk. */
.diamond .gear-icon { width: 84px; height: 84px; background: none; }
.diamond .gear-icon::after { content: ''; position: absolute; width: 58px; height: 58px; transform: rotate(45deg); border: 1px solid color-mix(in srgb, var(--r) 70%, transparent);
  background: radial-gradient(circle, color-mix(in srgb, var(--r) 24%, transparent), rgba(0,0,0,.45) 75%);
  box-shadow: 0 0 16px -6px var(--r), inset 0 0 0 3px rgba(0,0,0,.55), inset 0 0 0 4px color-mix(in srgb, var(--r) 30%, transparent); }
.diamond .gear-icon img { z-index: 1; }
</style>
</head>
<body>
<div class="page">
  <h1 class="engraved">Gear icons</h1>
  <p>The character modal’s Equipment rows. Same items in each, thin ones on purpose.</p>
  <div class="cards" id="root"></div>
</div>

<script>
const K = { physicalDamage: '#d0604f', magicDamage: '#ab8dd8', health: '#c33a2e', trueDamage: '#f1e9d6', critChance: '#d6a24f', lifesteal: '#b8433a' };
const GLYPH = {"physicalDamage":"<path d=\"m11 19-6-6\"/><path d=\"m5 21-2-2\"/><path d=\"m8 16-4 4\"/><path d=\"M9.5 17.5 21 6V3h-3L6.5 14.5\"/>","magicDamage":"<path d=\"m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72\"/><path d=\"m14 7 3 3\"/><path d=\"M5 6v4\"/><path d=\"M19 14v4\"/><path d=\"M10 2v2\"/><path d=\"M7 8H3\"/><path d=\"M21 16h-4\"/><path d=\"M11 3H9\"/>","health":"<path d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\"/>","trueDamage":"<path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/>","critChance":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"22\" x2=\"18\" y1=\"12\" y2=\"12\"/><line x1=\"6\" x2=\"2\" y1=\"12\" y2=\"12\"/><line x1=\"12\" x2=\"12\" y1=\"6\" y2=\"2\"/><line x1=\"12\" x2=\"12\" y1=\"22\" y2=\"18\"/>","lifesteal":"<path d=\"M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z\"/>"};
const icon = (stat) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${GLYPH[stat]}</svg>`;
const LABEL = { physicalDamage: 'Physical damage', magicDamage: 'Magic damage', health: 'Max health', trueDamage: 'True damage', critChance: 'Crit chance', lifesteal: 'Lifesteal' };

const ITEMS = [
  { name: 'Opal Staff', icon: 'arcane-staff', rarity: 'common', bonuses: [['magicDamage', 6]] },
  { name: 'Steel Sword', icon: 'steel-sword', rarity: 'common', bonuses: [['physicalDamage', 5]] },
  { name: 'Hexed Ring', icon: 'hexed-ring', rarity: 'uncommon', bonuses: [['magicDamage', 16], ['health', -5]] },
  { name: 'Frostpiercer Crossbow', icon: 'sunpiercer-bow', rarity: 'rare', bonuses: [['trueDamage', 40], ['critChance', 12]] },
  { name: 'Godslayer Greatblade', icon: 'godslayer-greatblade', rarity: 'epic', bonuses: [['physicalDamage', 42], ['health', 10], ['lifesteal', 3]], fx: '+30% damage to bosses above 75% HP.' },
];

const row = (it) => `<li class="gear-row" style="--r:var(--rarity-${it.rarity})">
  <span class="gear-icon"><img src="../../public/sprites/items/${it.icon}.png" alt="" /></span>
  <div class="gear-text">
    <span class="gear-name">${it.name}<span class="gear-rarity">${it.rarity}</span></span>
    <span class="gear-bonuses">${it.bonuses.map(([s, n]) => `<span class="gear-bonus ${n < 0 ? 'neg' : ''}" style="--k:${K[s]}"><span class="ic">${icon(s)}</span>${n < 0 ? '−' : '+'}${Math.abs(n)}% <span class="lab">${LABEL[s]}</span></span>`).join('')}</span>
    ${it.fx ? `<span class="gear-effect">${it.fx}</span>` : ''}
  </div></li>`;

const OPTIONS = [
  { id: 'A', cls: 'today', title: 'Today', note: 'For reference. About 1.5 screen pixels per art pixel, so one-pixel lines render unevenly.' },
  { id: 'B', cls: 'crisp', title: 'Crisp 2x', note: 'No new chrome. Every art pixel becomes an even 2x2 block and the item is about 30% bigger. B through F all use this.' },
  { id: 'C', cls: 'crisp well', title: 'Inventory well', note: 'A recessed square slot with a rarity hairline, an inner bevel and gold corner ticks like the modal frame.' },
  { id: 'D', cls: 'crisp outline', title: 'Outlined', note: 'A one-pixel dark rarity rim around the art plus a soft glow. Thickens staffs and blades without adding a box.' },
  { id: 'E', cls: 'crisp diamond', title: 'Diamond', note: 'The lit diamond from the Item found popup, shrunk, so gear looks the same in both places. Rows get a little taller.' },
  { id: 'F', cls: 'crisp well outline', title: 'Well + outline', note: 'C and D together.' },
];
document.getElementById('root').innerHTML = OPTIONS.map((o) => `<section class="opt">
  <h2 class="engraved"><b>${o.id}</b>${o.title}</h2><p>${o.note}</p>
  <div class="modal ${o.cls}"><h4 class="group-label">Equipment</h4><ul class="gear-list">${ITEMS.map(row).join('')}</ul></div>
</section>`).join('');
</script>
</body>
</html>
