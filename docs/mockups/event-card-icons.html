<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreakSlayer — event card icons (Ashen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
<style>
/* Where each event's icon goes now that the level-up cards are stacked rows. */
:root {
  --bg: #0b0a09; --text: #a1988a; --text-h: #ece3cd; --bone: #d8cdb5;
  --gold: #c8a96e; --gold-hi: #e6cf9a; --ash: #5c554a;
  --steel: #a8a092; --crit: #d6a24f;
  --line: rgba(200, 169, 110, 0.2); --line-mid: rgba(200, 169, 110, 0.4); --line-faint: rgba(200, 169, 110, 0.07);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--bone); background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(200,169,110,.1), transparent 70%), #070606; font: 500 17px/1.35 'Cormorant Garamond', Garamond, Georgia, serif; }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.engraved { font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }

.page { max-width: 1240px; margin: 0 auto; padding: 30px 16px 60px; }
.page > h1 { text-align: center; font-size: 14px; letter-spacing: .32em; color: var(--gold-hi); margin-bottom: 6px; }
.page > p { text-align: center; font-style: italic; color: var(--text); margin-bottom: 26px; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { display: flex; flex-direction: column; gap: 12px; width: 358px; max-width: 100%; }
.opt h2 { font-size: 12px; letter-spacing: .2em; color: var(--text-h); }
.opt h2 b { color: var(--gold); font-weight: 600; margin-right: 8px; }
.opt > p { font-style: italic; color: var(--text); font-size: 16px; line-height: 1.3; min-height: 2.6em; }

.modal { position: relative; padding: 18px 16px 16px; background: linear-gradient(180deg, rgba(27,24,21,.97), rgba(14,13,11,.99)); border: 1px solid var(--line); box-shadow: 0 20px 40px -24px rgba(0,0,0,.95); }
.modal::before { content: ''; position: absolute; inset: -1px; pointer-events: none; opacity: .75;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 12px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 12px no-repeat; }
.modal h3 { text-align: center; font-size: 13px; letter-spacing: .24em; color: var(--gold-hi); }
.emblem { position: relative; width: 78px; height: 78px; margin: 10px auto 6px; display: grid; place-items: center; }
.emblem::before { content: ''; position: absolute; inset: 10px; transform: rotate(45deg); border: 1px solid var(--gold-hi);
  background: radial-gradient(circle, rgba(230,199,127,.22), rgba(0,0,0,.55) 75%);
  box-shadow: inset 0 0 0 4px rgba(0,0,0,.5), inset 0 0 0 5px rgba(200,169,110,.18), 0 0 30px -8px rgba(230,199,127,.75); }
.emblem b { position: relative; font: 700 28px/1 'Cinzel', serif; color: var(--gold-hi); text-shadow: 0 0 14px rgba(230,180,90,.6); }
.sub { text-align: center; font-style: italic; color: var(--text); font-size: 16px; margin: 4px 0 12px; }

/* The shipped stacked card. */
.cards { display: grid; gap: 8px; }
.card { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 14px; text-align: left; overflow: hidden;
  background: rgba(0,0,0,.35); border: 1px solid var(--line); border-left: 2px solid var(--line-mid); transition: border-color .3s, box-shadow .3s; }
.card:hover { border-color: var(--gold); box-shadow: 0 0 26px -8px rgba(230,199,127,.5); }
.txt { position: relative; display: grid; gap: 3px; min-width: 0; }
.txt strong { font: 600 12.8px/1.2 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-h); }
.txt span { font-style: italic; font-size: 16px; color: var(--text); line-height: 1.25; }
.badge { position: absolute; top: 10px; right: 12px; font: 600 11px/1 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
svg.i { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* A: ringed medallion, the old card's ring scaled down. */
.ring { flex-shrink: 0; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-mid);
  background: radial-gradient(circle, rgba(230,199,127,.16), transparent 70%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.5), inset 0 0 0 4px rgba(200,169,110,.18); }
.ring svg { width: 22px; height: 22px; stroke-width: 1.3; }

/* B: bare icon. */
.bare { flex-shrink: 0; width: 26px; display: grid; place-items: center; }
.bare svg { width: 24px; height: 24px; }

/* C: diamond frame, echoing the level emblem. */
.gem { flex-shrink: 0; position: relative; width: 44px; height: 44px; display: grid; place-items: center; }
.gem::before { content: ''; position: absolute; inset: 7px; transform: rotate(45deg); border: 1px solid var(--line-mid);
  background: radial-gradient(circle, rgba(230,199,127,.12), rgba(0,0,0,.4) 75%); }
.gem svg { position: relative; width: 18px; height: 18px; stroke-width: 1.4; }

/* D: large faint watermark, cropped by the right edge. */
.mark { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); opacity: .13; }
.mark svg { width: 74px; height: 74px; stroke-width: 1.1; }

/* E: small icon inline with the title. */
.txt strong .inl { display: inline-block; vertical-align: -3px; margin-right: 8px; }
.txt strong .inl svg { width: 15px; height: 15px; stroke-width: 1.7; }
</style>
</head>
<body>
<div class="page">
  <h1 class="engraved">Event card icons</h1>
  <p>Where the icon sits on the stacked level-up cards.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const ICONS = {
  slots: ['var(--steel)', '<path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 10h8"/><path d="M8 18h8"/><path d="M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>'],
  crit: ['var(--crit)', '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'],
  quest: ['var(--steel)', '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>'],
};
const EVENTS = [
  { icon: 'slots', title: 'More item slots', desc: 'Your equipment slots increase from 4 to 6.', oneTime: true },
  { icon: 'crit', title: 'Crit boost', desc: '+20% crit chance for 3 days.' },
  { icon: 'quest', title: 'Side quest', desc: 'Something rare awaits.' },
];
const svg = (name) => `<svg class="i" viewBox="0 0 24 24" style="color:${ICONS[name][0]}">${ICONS[name][1]}</svg>`;

const OPTS = [
  { k: '0', t: 'None', p: 'Today: text only.', icon: () => '' },
  { k: 'A', t: 'Ringed medallion', p: 'The old card’s ring, scaled down to a 44px coin on the left.', icon: (n) => `<span class="ring">${svg(n)}</span>` },
  { k: 'B', t: 'Bare icon', p: 'Just the icon in its own colour, left of the text.', icon: (n) => `<span class="bare">${svg(n)}</span>` },
  { k: 'C', t: 'Diamond frame', p: 'Icon set in a small diamond, matching the level emblem above.', icon: (n) => `<span class="gem">${svg(n)}</span>` },
  { k: 'D', t: 'Watermark', p: 'Large faint icon cropped by the right edge. Text keeps the full width.', icon: (n) => `<span class="mark">${svg(n)}</span>` },
  { k: 'E', t: 'Inline with title', p: 'Small icon leading the title line. Lightest touch.', inline: true },
];

document.getElementById('grid').innerHTML = OPTS.map(o => `
  <div class="opt">
    <h2 class="engraved"><b>${o.k}</b>${o.t}</h2>
    <p>${o.p}</p>
    <div class="modal">
      <h3 class="engraved">Level up!</h3>
      <div class="emblem"><b>7</b></div>
      <p class="sub">Choose 1 event</p>
      <div class="cards">
        ${EVENTS.map(e => `
          <button type="button" class="card">
            ${o.inline ? '' : o.icon(e.icon)}
            <span class="txt">
              <strong>${o.inline ? `<span class="inl">${svg(e.icon)}</span>` : ''}${e.title}</strong>
              <span>${e.desc}</span>
            </span>
            ${e.oneTime ? '<em class="badge">One-time</em>' : ''}
          </button>`).join('')}
      </div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
